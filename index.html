<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植物知識大挑戰｜課堂積分遊戲</title>
<style>
:root {
  --ink:#20352f;
  --green:#24745c;
  --mint:#eaf6ef;
  --gold:#ffd166;
  --coral:#ef7868;
  --paper:#fffdf7
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  background:linear-gradient(135deg,#eaf6ef,#fff8e8);
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
  min-height:100vh
}
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:18px clamp(16px,4vw,48px);
  background:#fffdf7eF;
  border-bottom:2px solid #d9eadf;
  position:sticky;
  top:0;
  z-index:3
}
.brand {
  font-weight:900;
  font-size:clamp(18px,2.5vw,26px)
}
.scorebox {
  background:var(--ink);
  color:white;
  padding:10px 18px;
  border-radius:16px;
  font-weight:800;
  white-space:nowrap
}
.scorebox strong {
  color:var(--gold);
  font-size:24px;
  margin-left:8px;
  backdrop-filter: blur(10px)
}
main {
  max-width:1000px;
  margin:24px auto;
  padding:0 16px 40px
}
.toolbar {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px
}
.progress {
  font-weight:700;
  color:#4d6a60
}
.selects {
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
select,button {
  font:inherit
}
select {
  padding:10px 12px;
  border:1px solid #bdd5c5;
  border-radius:12px;
  background:white;
  color:var(--ink)
}
.card {
  background:var(--paper);
  border:2px solid #dbe9dc;
  border-radius:26px;
  padding:clamp(20px,4vw,42px);
  box-shadow:0 12px 28px #244a3210
}
.eyebrow {
  color:var(--green);
  font-weight:900;
  letter-spacing:.08em;
  font-size:14px
}
.question {
  font-size:clamp(24px,4vw,38px);
  line-height:1.5;
  font-weight:900;
  margin:16px 0 26px
}
.chips-label {
  font-weight:800;
  margin:0 0 12px
}
.chips {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px
}
.chip {
  border:3px solid #e9b84d;
  background:#fff0bd;
  border-radius:18px;
  padding:16px 8px;
  cursor:pointer;
  font-weight:900;
  font-size:clamp(20px,3vw,28px);
  color:#684b12;
  transition:.15s
}
.chip small {
  display:block;
  font-size:13px;
  font-weight:700;
  margin-top:4px
}
.chip:hover {
  transform:translateY(-2px)
}
.chip.selected {
  background:var(--gold);
  border-color:#d88b22;
  box-shadow:0 0 0 4px #ffd16655
}
.chip:disabled {
  opacity:.45;
  cursor:not-allowed;
  transform:none
}
.answer {
  display:none;
  margin-top:22px;
  padding:18px 20px;
  background:var(--mint);
  border-radius:16px;
  border-left:5px solid var(--green);
  font-size:19px;
  line-height:1.7
}
.answer.show {
  display:block
}
.answer b {
  display:block;
  margin-bottom:5px;
  color:var(--green)
}
.actions {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px
}
.btn {
  border:0;
  border-radius:13px;
  padding:13px 18px;
  font-weight:900;
  cursor:pointer
}
.btn:disabled {
  opacity:.45;
  cursor:not-allowed
}
.primary {
  background:var(--green);
  color:white
}
.correct {
  background:#d9f1df;
  color:#145b35
}
.wrong {
  background:#ffe1dc;
  color:#8c2e24
}
.neutral {
  background:#e8eee9;
  color:var(--ink)
}
.feedback {
  font-weight:900;
  min-height:28px;
  margin-top:12px
}
.hint {
  color:#62786d;
  font-size:14px;
  line-height:1.6;
  margin-top:16px
}
.bottom {
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px
}
.tiny {
  font-size:13px;
  color:#6b7d73
}
.hidden {
  display:none!important
}
@media(max-width:560px) {
  header {
    align-items:flex-start
  }
  .chips {
    gap:7px
  }
  .chip {
    padding:14px 4px
  }
  .bottom .btn {
    flex:1
  }
}

<body>
<header>
  <div class="brand"><span class="brand-icon">🌿</span><span>植物知識大挑戰<small>課堂互動積分遊戲</small></span></div>
  <div class="header-actions">
    <a class="sponsor-btn" href="https://biaogenet.qzz.io/" target="_blank" rel="noopener noreferrer" aria-label="前往錶哥熊網頁">
      <img class="sponsor-bear" src="https://biaogenet.qzz.io/images/favicon.png"><span><b>由錶哥熊贊助</b><small>拜訪錶哥熊網頁 ↗</small></span>
    </a>
    <div class="scorebox"><span>目前積分</span><strong id="score">0</strong><small>PTS</small></div>
  </div>
</header>
<main>
 <div class="toolbar">
  <div class="progress" id="progress">第 1 / 30 題</div>
  <div class="selects">
   <select id="sectionFilter" aria-label="選擇題目單元"><option value="all">全部單元</option><option value="2-3">2-3 營養器官的繁殖</option><option value="3-1">3-1 經濟植物</option><option value="3-2">3-2 植物仿生學</option></select>
   <button class="btn neutral" id="restart">重新開始</button>
  </div>
 </div>
 <section class="card">
  <div class="eyebrow" id="section">2-3｜營養器官的繁殖</div>
  <div class="question" id="question">準備開始！</div>
  <p class="chips-label">① 先選擇你要下注的籌碼</p>
  <div class="chips" id="chips"></div>
  <div class="answer" id="answer"><b>參考答案</b><span id="answerText"></span></div>
  <div class="actions" id="judgeActions">
   <button class="btn primary" id="reveal" disabled>揭曉參考答案</button>
   <button class="btn correct" id="correct" disabled>答對 ✓</button>
   <button class="btn wrong" id="wrong" disabled>答錯 −</button>
  </div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="bottom">
   <div class="tiny" id="betInfo">選好籌碼後，請學生作答，再由老師判定。</div>
   <button class="btn primary" id="next" disabled>下一題 →</button>
  </div>
 </section>
 <p class="hint">玩法：先選籌碼，再讓學生回答。老師按「揭曉參考答案」後，依學生回答按「答對」或「答錯」。答對加上所選積分，答錯扣除所選積分；積分最低為 0。每題籌碼會逐步提高，可用單元選單篩選題目。</p>
</main>
<footer>🌱 用好奇心探索植物世界 · 網頁架設由錶哥熊贊助</footer>
<script>
const questions = [
{unit:"2-3",title:"營養器官的繁殖",q:"植物的根、莖和葉，主要功能是什麼？",a:"幫助植物生長，提供所需的養分和水分。"},
{unit:"2-3",title:"營養器官的繁殖",q:"除了提供養分和水分外，哪些植物的根、莖、葉還具有繁殖功能？",a:"吊蘭、馬鈴薯、石蓮、黃金葛、番薯、萬年青、落地生根等。"},
{unit:"2-3",title:"營養器官的繁殖",q:"吊蘭具有什麼樣的結構，可以下垂來長出新芽？",a:"長長的走莖。"},
{unit:"2-3",title:"營養器官的繁殖",q:"馬鈴薯放在廚房太久，會冒出綠色新芽的是哪個部位？",a:"塊莖。"},
{unit:"2-3",title:"營養器官的繁殖",q:"石蓮通常利用哪一個器官進行繁殖，且葉旁會長出新芽？",a:"葉。"},
{unit:"2-3",title:"營養器官的繁殖",q:"黃金葛的莖上的節會長出什麼？",a:"葉子和根。"},
{unit:"2-3",title:"營養器官的繁殖",q:"番薯適合使用哪一種方式進行繁殖？",a:"根繁殖，例如將番薯的塊根放在水中觀察。"},
{unit:"2-3",title:"營養器官的繁殖",q:"萬年青適合使用哪一種方式進行繁殖？",a:"莖繁殖，例如將萬年青的莖放在水中觀察。"},
{unit:"2-3",title:"營養器官的繁殖",q:"落地生根適合使用哪一種方式進行繁殖？",a:"葉繁殖，例如將葉放在土壤上或濕棉花上。"},
{unit:"2-3",title:"營養器官的繁殖",q:"植物除了利用種子繁殖外，還可以利用哪些部位繁衍下一代？",a:"根、莖、葉等營養器官。"},
{unit:"3-1",title:"經濟植物在人類生活中的應用",q:"植物藉由什麼讓生命一代一代延續？",a:"繁殖。"},
{unit:"3-1",title:"經濟植物在人類生活中的應用",q:"人類會將具有什麼性質的植物大量繁殖並販售？",a:"具有經濟價值。"},
{unit:"3-1",title:"經濟植物在人類生活中的應用",q:"哪一種植物是臺灣具國際競爭力、受到世界各地喜愛的經濟植物？",a:"蘭花。"},
{unit:"3-1",title:"經濟植物在人類生活中的應用",q:"臺灣蘭花主要外銷到哪些國家或地區？",a:"美國、日本和歐洲等地。"},
{unit:"3-1",title:"經濟植物在人類生活中的應用",q:"花農如何維持蘭花優良品質並快速繁殖？",a:"運用繁殖技術讓每株繁殖出的花維持優良品質，有時也透過品種改良培育新品種。"},
{unit:"3-1",title:"經濟植物在人類生活中的應用",q:"茶樹的葉子可以加工製成什麼，並外銷世界各地？",a:"各種茶。"},
{unit:"3-1",title:"經濟植物在人類生活中的應用",q:"茶樹的葉子可以加工做成什麼？",a:"茶葉。"},
{unit:"3-1",title:"經濟植物在人類生活中的應用",q:"有些農作物經過什麼過程後，可能更好吃或產量更多？",a:"品種改良。"},
{unit:"3-1",title:"經濟植物在人類生活中的應用",q:"課本列舉哪些經過品種改良、讓果實更好吃的水果？",a:"鳳梨釋迦、芒果。"},
{unit:"3-1",title:"經濟植物在人類生活中的應用",q:"人類會選擇栽培具有哪些特性的植物，以維持優良品質並改良品種？",a:"栽培容易、生長快速，且能大量繁殖的植物。"},

];
let score=0, order=[], index=0, selected=null, judged=false, revealed=false;
const $=id=>document.getElementById(id);
function makeOrder(){const filter=$("sectionFilter").value;order=questions.map((_,i)=>i).filter(i=>filter==="all"||questions[i].unit===filter);index=0;selected=null;judged=false;revealed=false;render();}
function chipValues(){if(index===0)return [1,3,5];return [5+(index-1)*5,10+(index-1)*5,15+(index-1)*5];}
function render(){
 if(index>=order.length){$("section").textContent="挑戰完成";$("question").textContent="🎉 太棒了！本輪題目全部完成！";$("chips").innerHTML="";$("answer").classList.remove("show");$("judgeActions").classList.add("hidden");$("next").textContent="再玩一次 ↻";$("next").disabled=false;$("progress").textContent=`完成 ${order.length} 題`; $("feedback").textContent=`本輪結束！目前積分：${score} 分`; $("betInfo").textContent="可按「再玩一次」重新挑戰。";return;}
 const q=questions[order[index]];
 $("section").textContent=q.unit+"｜"+q.title;$("question").textContent=q.q;$("progress").textContent=`第 ${index+1} / ${order.length} 題`;$("score").textContent=score;
 $("chips").innerHTML="";chipValues().forEach(v=>{const b=document.createElement("button");b.className="chip"+(selected===v?" selected":"");b.innerHTML=`${v}<small>分籌碼</small>`;b.disabled=judged;b.onclick=()=>{selected=v;render();};$("chips").appendChild(b);});
 $("answerText").textContent=q.a;$("answer").classList.toggle("show",revealed);$("judgeActions").classList.remove("hidden");$("reveal").disabled=selected===null||revealed||judged;$("correct").disabled=selected===null||!revealed||judged;$("wrong").disabled=selected===null||!revealed||judged;$("next").disabled=!judged;$("next").textContent="下一題 →";
 $("feedback").textContent=judged? $("feedback").textContent:"";$("betInfo").textContent=selected===null?"選好籌碼後，請學生作答，再由老師判定。":`已選擇 ${selected} 分籌碼。答對 +${selected} 分，答錯 −${selected} 分。`;
}
$("reveal").onclick=()=>{revealed=true;render();};
$("correct").onclick=()=>{score+=selected;judged=true;$("feedback").textContent=`答對了！ +${selected} 分 🎉`;render();$("score").textContent=score;};
$("wrong").onclick=()=>{score=Math.max(0,score-selected);judged=true;$("feedback").textContent=`答錯了！ −${selected} 分，繼續加油！`;render();$("score").textContent=score;};
$("next").onclick=()=>{if(index>=order.length){makeOrder();return;}index++;selected=null;judged=false;revealed=false;render();};
$("restart").onclick=()=>{score=0;makeOrder();};
$("sectionFilter").onchange=()=>makeOrder();
makeOrder();
</script>
